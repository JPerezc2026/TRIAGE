<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRIAGE — Observación</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B1120;
  --bg2: #111827;
  --panel: #1A2332;
  --panel2: #243044;
  --border: #2D3A4F;
  --text: #F1F5F9;
  --text2: #94A3B8;
  --mute: #64748B;
  --cyan: #22D3EE;
  --cyan-dim: rgba(34,211,238,.15);
  --red: #F43F5E;
  --red-dim: rgba(244,63,94,.15);
  --orange: #FB923C;
  --yellow: #FBBF24;
  --green: #34D399;
  --green-dim: rgba(52,211,153,.15);
  --blue: #60A5FA;
  --purple: #A78BFA;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
header{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:10px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{
  width:34px;height:34px;
  background:linear-gradient(135deg,#22D3EE,#06B6D4);
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.logo-title{font-size:13px;font-weight:700;letter-spacing:1.5px;}
.logo-sub{font-size:10px;color:var(--mute);letter-spacing:1px;margin-top:1px;}
#clk{font-family:var(--mono);font-size:14px;color:var(--cyan);letter-spacing:1px;}
.hbtns{display:flex;gap:8px;align-items:center;}
.hbtn{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text2);
  font-family:var(--sans);
  font-size:11px;
  font-weight:500;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  transition:all .2s;
}
.hbtn:hover{border-color:var(--cyan);color:var(--cyan);}

/* MAIN LAYOUT */
.main{
  display:grid;
  grid-template-columns:280px 1fr;
  flex:1;
  min-height:0;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.sb-hdr{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.sb-tit{font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--mute);}
.sb-badge{
  background:var(--cyan);
  color:#0B1120;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  padding:2px 8px;
  border-radius:20px;
}
.sb-search{
  padding:10px 12px;
  border-bottom:1px solid var(--border);
}
.sb-search input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:7px;
  color:var(--text);
  font-size:12px;
  padding:8px 12px 8px 32px;
  outline:none;
}
.sb-search input:focus{border-color:var(--cyan);}
.sb-search{position:relative;}
.sb-search::before{
  content:'🔍';
  position:absolute;
  left:22px;top:50%;
  transform:translateY(-50%);
  font-size:12px;
  pointer-events:none;
}
.sb-list{
  flex:1;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.pac-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  cursor:pointer;
  transition:all .2s;
  border-left:3px solid var(--cyan);
}
.pac-card:hover{background:var(--panel2);border-color:#3B4A63;}
.pac-card.sel{
  background:var(--panel2);
  border-color:var(--cyan);
  box-shadow:0 0 0 1px var(--cyan);
}
.pac-card.alerta{border-left-color:var(--red);}
.pc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.pc-meta{font-family:var(--mono);font-size:10px;color:var(--mute);}
.pc-prio{
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  padding:2px 7px;
  border-radius:4px;
}
.pp1{background:var(--red-dim);color:var(--red);}
.pp2{background:rgba(251,146,60,.15);color:var(--orange);}
.pp3{background:rgba(251,191,36,.15);color:var(--yellow);}
.pp4{background:var(--green-dim);color:var(--green);}
.pp5{background:var(--cyan-dim);color:var(--cyan);}
.pc-nom{font-size:13px;font-weight:600;margin-bottom:2px;}
.pc-motivo{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-time{
  display:flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:10px;color:var(--mute);
  margin-top:6px;
}
.pc-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.empty-sb{
  text-align:center;padding:40px 16px;
  color:var(--mute);font-size:12px;line-height:1.8;
}

/* CONTENT */
.content{
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}
.content-empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--mute);font-size:13px;gap:12px;
  opacity:.5;
}
.content-empty .icon{font-size:42px;}

/* FICHA */
.ficha{padding:16px 18px;display:flex;flex-direction:column;gap:14px;}

/* HEADER FICHA */
.ficha-hdr{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.fh-left{display:flex;align-items:center;gap:12px;}
.fh-prio-dot{
  width:12px;height:12px;border-radius:50%;
  flex-shrink:0;
}
.fh-nom{font-size:17px;font-weight:700;}
.fh-meta{font-size:12px;color:var(--text2);margin-top:3px;}
.fh-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.fh-timer-lbl{font-size:10px;color:var(--mute);}
.fh-timer{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--cyan);}
.btn-alta{
  background:var(--red);
  border:none;color:#fff;
  font-size:11px;font-weight:600;
  padding:8px 16px;border-radius:7px;
  cursor:pointer;transition:opacity .2s;
}
.btn-alta:hover{opacity:.85;}

/* SECTIONS GRID */
.secciones{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.sec{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.sec.full{grid-column:1/-1;}
.sec-hdr{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.sec-tit{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--text2);}
.sec-cnt{font-family:var(--mono);font-size:10px;color:var(--mute);}
.sec-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;}

/* VITALES */
.vitales-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:4px;
}
.vc{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
  position:relative;
}
.vc.alerta{border-color:var(--red);background:var(--red-dim);}
.vc-lbl{font-size:9px;color:var(--mute);letter-spacing:.5px;margin-bottom:4px;}
.vc-val{font-size:18px;font-weight:700;}
.vc-val.alerta{color:var(--red);}
.vc-hora{font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:3px;}

/* FORMS */
.qform{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;}
.qi{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-size:12px;
  padding:7px 10px;
  outline:none;
  min-width:0;
}
.qi:focus{border-color:var(--cyan);}
.qi::placeholder{color:var(--mute);}
.qbtn{
  background:var(--cyan);
  border:none;color:#0B1120;
  font-size:11px;font-weight:600;
  padding:7px 12px;border-radius:6px;
  cursor:pointer;white-space:nowrap;
  transition:opacity .2s;
}
.qbtn:hover{opacity:.85;}

/* ITEMS */
.reg-item{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}
.ri-txt{font-size:13px;font-weight:500;}
.ri-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.ri-hora{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:3px;}
.ri-badge{
  display:inline-block;
  font-size:9px;font-weight:600;
  padding:2px 7px;border-radius:4px;
  margin-top:4px;
}
.badge-pend{background:rgba(251,191,36,.15);color:var(--yellow);}
.badge-listo{background:var(--green-dim);color:var(--green);}
.badge-med{background:var(--cyan-dim);color:var(--cyan);}
.ri-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.ri-del{
  background:transparent;border:none;
  color:var(--mute);cursor:pointer;font-size:14px;
  padding:2px 4px;transition:color .2s;
}
.ri-del:hover{color:var(--red);}
.btn-listo{
  background:var(--green);
  border:none;color:#0B1120;
  font-size:9px;font-weight:600;
  padding:3px 8px;border-radius:4px;
  cursor:pointer;
}

/* NOTAS */
.nota-item{
  background:var(--panel2);
  border-left:3px solid var(--cyan);
  border-radius:0 8px 8px 0;
  padding:10px 12px;
}
.nota-txt{font-size:13px;line-height:1.5;white-space:pre-wrap;}
.nota-meta{
  font-size:11px;color:var(--mute);
  margin-top:6px;
  display:flex;justify-content:space-between;align-items:center;
}
.empty-sec{color:var(--mute);font-size:12px;text-align:center;padding:16px 0;opacity:.5;}

/* FOOTER */
footer{
  background:var(--bg2);
  border-top:1px solid var(--border);
  padding:8px 18px;
  display:flex;gap:18px;align-items:center;
  flex-shrink:0;
  font-size:11px;
}
.fi{display:flex;align-items:center;gap:6px;color:var(--text2);}
.fdot{width:7px;height:7px;border-radius:50%;}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--cyan);font-family:var(--mono);font-size:10px;}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 1.5s ease-in-out infinite;}

/* MODAL ALTA */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  z-index:100;
  display:flex;align-items:center;justify-content:center;
}
.modal{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:24px;
  width:340px;
  text-align:center;
}
.modal h3{font-size:16px;margin-bottom:6px;}
.modal p{font-size:12px;color:var(--text2);margin-bottom:16px;}
.modal-info{
  background:var(--panel2);
  border-radius:8px;
  padding:12px;
  text-align:left;
  margin-bottom:16px;
  font-size:12px;
}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-btns button{
  padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;
}
.btn-cancel{background:var(--panel2);color:var(--text);border:1px solid var(--border)!important;}
.btn-confirm{background:var(--red);color:#fff;}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* RESPONSIVE */
@media (max-width:900px){
  .main{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .secciones{grid-template-columns:1fr;}
  .vitales-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🛏</div>
    <div>
      <div class="logo-title">OBSERVACIÓN</div>
      <div class="logo-sub">SEGUIMIENTO CLÍNICO EN TIEMPO REAL</div>
    </div>
  </div>
  <div class="hbtns">
    <div id="clk">--:--:--</div>
    <button class="hbtn" onclick="window.open('triage-medico.html')">← PANEL MÉDICO</button>
    <button class="hbtn" onclick="window.open('triage-reportes.html')">📊 REPORTES</button>
  </div>
</header>

<div class="main">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sb-hdr">
      <div class="sb-tit">EN OBSERVACIÓN</div>
      <div class="sb-badge" id="obs-badge">0</div>
    </div>
    <div class="sb-search">
      <input id="obs-buscar" placeholder="Buscar paciente..." oninput="renderSidebar()">
    </div>
    <div class="sb-list" id="sb-list">
      <div class="empty-sb">Sin pacientes<br>en observación</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content">
    <div class="content-empty">
      <div class="icon">🛏</div>
      <div>Selecciona un paciente<br>para ver su expediente</div>
    </div>
  </div>
</div>

<footer>
  <div class="fi"><div class="fdot" style="background:var(--cyan)"></div><span id="f-total">0</span> en obs.</div>
  <div class="fi"><div class="fdot" style="background:var(--red)"></div><span id="f-alertas">0</span> con alertas</div>
  <div class="fi"><div class="fdot" style="background:var(--yellow)"></div><span id="f-reval">0</span> revaloración pendiente</div>
  <div class="live"><div class="ldot"></div>TIEMPO REAL</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update, remove, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDTgiL6OvNFYh-PC4g57GTw04pclU-nfs",
  authDomain: "triage-centro-de-salud.firebaseapp.com",
  databaseURL: "https://triage-centro-de-salud-default-rtdb.firebaseio.com",
  projectId: "triage-centro-de-salud",
  storageBucket: "triage-centro-de-salud.firebasestorage.app",
  messagingSenderId: "66063012451",
  appId: "1:66063012451:web:8be493b361302fbd185e56"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const obsRef = ref(db, 'observacion');

let pacientes = {};
let selId = null;

const ICOS = {1:'🚨',2:'⚠️',3:'🔶',4:'✅',5:'🔵'};
const COLS = {1:'var(--red)',2:'var(--orange)',3:'var(--yellow)',4:'var(--green)',5:'var(--cyan)'};

/* ── RELOJ Y TIMERS ── */
setInterval(() => {
  document.getElementById('clk').textContent = new Date().toLocaleTimeString('es-MX', {hour12:false});
  document.querySelectorAll('.timer-obs').forEach(el => {
    const ts = parseInt(el.dataset.ingreso);
    if (ts) el.textContent = tiempoTranscurrido(ts);
  });
}, 1000);

function tiempoTranscurrido(ts) {
  const d = Math.floor((Date.now() - ts) / 1000);
  const h = Math.floor(d / 3600);
  const m = Math.floor((d % 3600) / 60);
  const s = d % 60;
  if (h > 0) return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
}

function hora() {
  return new Date().toLocaleTimeString('es-MX', {hour12:false});
}
function fechaHora() {
  return new Date().toLocaleString('es-MX');
}

/* ── ALERTAS CLÍNICAS ── */
function verificarAlertas(p) {
  const alertas = [];
  const vits = p.vitales || [];
  if (vits.length === 0) return alertas;
  const u = vits[vits.length - 1];

  const sato2 = parseFloat(u.sato2);
  if (!isNaN(sato2) && sato2 < 90) alertas.push(`SpO₂ baja: ${sato2}%`);

  const fc = parseFloat(u.fc);
  if (!isNaN(fc)) {
    if (fc > 130) alertas.push(`Taquicardia: ${fc} lpm`);
    if (fc < 40)  alertas.push(`Bradicardia: ${fc} lpm`);
  }

  if (u.presion) {
    const tas = parseFloat(u.presion.split('/')[0]);
    if (!isNaN(tas) && tas < 90) alertas.push(`Hipotensión: TAS ${tas}`);
  }

  const temp = parseFloat(u.temp);
  if (!isNaN(temp)) {
    if (temp >= 39) alertas.push(`Fiebre alta: ${temp}°C`);
    if (temp < 35)  alertas.push(`Hipotermia: ${temp}°C`);
  }

  const fr = parseFloat(u.fr);
  if (!isNaN(fr)) {
    if (fr > 30) alertas.push(`Taquipnea: ${fr} rpm`);
    if (fr < 8)  alertas.push(`Bradipnea: ${fr} rpm`);
  }

  return alertas;
}

/* ── FIREBASE ── */
onValue(obsRef, snap => {
  pacientes = snap.val() || {};
  renderSidebar();
  actualizarFooter();
  if (selId && pacientes[selId]) renderFicha(selId);
  else if (selId && !pacientes[selId]) {
    selId = null;
    document.getElementById('content').innerHTML = `
      <div class="content-empty">
        <div class="icon">🛏</div>
        <div>Selecciona un paciente<br>para ver su expediente</div>
      </div>`;
  }
});

function actualizarFooter() {
  const total = Object.keys(pacientes).length;
  document.getElementById('obs-badge').textContent = total;
  document.getElementById('f-total').textContent = total;
  const conAlertas = Object.values(pacientes).filter(p => verificarAlertas(p).length > 0).length;
  document.getElementById('f-alertas').textContent = conAlertas;
  document.getElementById('f-reval').textContent = Object.values(pacientes).filter(p => p.revFin && p.revFin < Date.now()).length;
}

/* ── SIDEBAR ── */
function renderSidebar() {
  const list = document.getElementById('sb-list');
  const buscar = (document.getElementById('obs-buscar')?.value || '').toLowerCase();
  let pacs = Object.entries(pacientes).sort((a,b) => (a[1].prioridad||5) - (b[1].prioridad||5));

  if (buscar) {
    pacs = pacs.filter(([id,p]) =>
      (p.nombre||'').toLowerCase().includes(buscar) ||
      String(p.num||'').includes(buscar) ||
      (p.numeroCama||'').toLowerCase().includes(buscar)
    );
  }

  if (pacs.length === 0) {
    list.innerHTML = `<div class="empty-sb">${buscar ? 'Sin resultados' : 'Sin pacientes<br>en observación'}</div>`;
    return;
  }

  list.innerHTML = pacs.map(([id, p]) => {
    const alertas = verificarAlertas(p);
    const tieneAlerta = alertas.length > 0;
    return `
    <div class="pac-card ${selId===id?'sel':''} ${tieneAlerta?'alerta':''}" onclick="selPac('${id}')">
      <div class="pc-top">
        <div class="pc-meta">#${p.num||'?'} · ${p.edad||'?'}a · ${p.sexo||''}</div>
        <div class="pc-prio pp${p.prioridad||5}">${ICOS[p.prioridad||5]} P${p.prioridad||5}</div>
      </div>
      <div class="pc-nom">${p.nombre||'Sin nombre'}</div>
      <div class="pc-motivo">${p.motivo||'—'}</div>
      <div class="pc-time">
        <div class="pc-dot"></div>
        <span class="timer-obs" data-ingreso="${p.ingresoObs||Date.now()}">${tiempoTranscurrido(p.ingresoObs||Date.now())}</span>
      </div>
    </div>`;
  }).join('');
}

window.selPac = id => {
  selId = id;
  renderSidebar();
  renderFicha(id);
};

/* ── FICHA ── */
function renderFicha(id) {
  const p = pacientes[id];
  if (!p) return;

  const meds  = p.medicamentos || [];
  const ests  = p.estudios || [];
  const vits  = p.vitales || [];
  const notas = p.notas || [];
  const alertas = verificarAlertas(p);
  const uv = vits.length > 0 ? vits[vits.length-1] : null;

  function esAlerta(campo, val) {
    if (campo==='sato2') return parseFloat(val) < 90;
    if (campo==='fc') return parseFloat(val)>130 || parseFloat(val)<40;
    if (campo==='temp') return parseFloat(val)>=39 || parseFloat(val)<35;
    if (campo==='presion') return parseFloat((val||'').split('/')[0]) < 90;
    if (campo==='fr') return parseFloat(val)>30 || parseFloat(val)<8;
    return false;
  }

  document.getElementById('content').innerHTML = `
  <div class="ficha">
    <!-- HEADER -->
    <div class="ficha-hdr">
      <div class="fh-left">
        <div class="fh-prio-dot" style="background:${COLS[p.prioridad||5]}"></div>
        <div>
          <div class="fh-nom">${p.nombre||'Sin nombre'}</div>
          <div class="fh-meta">#${p.num||'?'} · ${p.edad||'?'} años · ${p.sexo||'—'} · Ingresó: ${p.horaIngreso||p.hora||'—'}</div>
          <div class="fh-meta" style="margin-top:2px">${p.motivo||'—'}</div>
          ${p.numeroCama ? `<div style="margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--cyan);font-weight:600">🛏 Cama ${p.numeroCama}</div>` : ''}
        </div>
      </div>
      <div class="fh-right">
        <div class="fh-timer-lbl">Tiempo en observación</div>
        <div class="fh-timer timer-obs" data-ingreso="${p.ingresoObs||Date.now()}">${tiempoTranscurrido(p.ingresoObs||Date.now())}</div>
        <button class="btn-alta" onclick="darAlta('${id}')">✕ DAR DE ALTA</button>
      </div>
    </div>

    ${alertas.length > 0 ? `
    <div style="background:var(--red-dim);border:1px solid var(--red);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px;">
      ${alertas.map(a => `<span style="background:var(--red);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;">⚠ ${a}</span>`).join('')}
    </div>` : ''}

    <div class="secciones">
      <!-- SIGNOS VITALES -->
      <div class="sec full">
        <div class="sec-hdr">
          <div class="sec-tit">💓 SIGNOS VITALES</div>
          <span class="sec-cnt">${vits.length} registros</span>
        </div>
        <div class="sec-body">
          ${uv ? `
          <div class="vitales-grid">
            <div class="vc ${esAlerta('presion',uv.presion)?'alerta':''}">
              <div class="vc-lbl">PRESIÓN ARTERIAL</div>
              <div class="vc-val ${esAlerta('presion',uv.presion)?'alerta':''}">${uv.presion||'—'}</div>
              <div class="vc-hora">${uv.hora||''}</div>
            </div>
            <div class="vc ${esAlerta('temp',uv.temp)?'alerta':''}">
              <div class="vc-lbl">TEMPERATURA</div>
              <div class="vc-val ${esAlerta('temp',uv.temp)?'alerta':''}">${uv.temp||'—'}°C</div>
              <div class="vc-hora">${uv.hora||''}</div>
            </div>
            <div class="vc ${esAlerta('sato2',uv.sato2)?'alerta':''}">
              <div class="vc-lbl">SAT. O₂</div>
              <div class="vc-val ${esAlerta('sato2',uv.sato2)?'alerta':''}">${uv.sato2||'—'}%</div>
              <div class="vc-hora">${uv.hora||''}</div>
            </div>
            <div class="vc ${esAlerta('fc',uv.fc)?'alerta':''}">
              <div class="vc-lbl">FREC. CARDÍACA</div>
              <div class="vc-val ${esAlerta('fc',uv.fc)?'alerta':''}">${uv.fc||'—'} <span style="font-size:12px">lpm</span></div>
              <div class="vc-hora">${uv.hora||''}</div>
            </div>
          </div>` : '<div class="empty-sec">Sin registros de vitales</div>'}

          <div class="qform">
            <input class="qi" id="v-presion" placeholder="Presión (120/80)" style="width:100px">
            <input class="qi" id="v-temp" placeholder="Temp (°C)" style="width:80px">
            <input class="qi" id="v-sato2" placeholder="SatO2 (%)" style="width:80px">
            <input class="qi" id="v-fc" placeholder="FC (lpm)" style="width:80px">
            <input class="qi" id="v-fr" placeholder="FR (rpm)" style="width:80px">
            <input class="qi" id="v-glucosa" placeholder="Glucosa" style="width:80px">
            <button class="qbtn" onclick="agregarVital('${id}')">+ Registrar</button>
          </div>
        </div>
      </div>

      <!-- MEDICAMENTOS -->
      <div class="sec">
        <div class="sec-hdr">
          <div class="sec-tit">💊 MEDICAMENTOS</div>
          <span class="sec-cnt">${meds.length} administrados</span>
        </div>
        <div class="sec-body">
          ${meds.length===0 ? '<div class="empty-sec">Sin registros</div>' :
            meds.map((m,i) => `
            <div class="reg-item">
              <div>
                <div class="ri-txt">${m.nombre}${m.dosis ? ' — '+m.dosis : ''}</div>
                ${m.via ? `<div class="ri-badge badge-med">${m.via}</div>` : ''}
                <div class="ri-hora">⏱ ${m.hora||''}</div>
              </div>
              <button class="ri-del" onclick="eliminarItem('${id}','medicamentos',${i})">✕</button>
            </div>`).join('')}
          <div class="qform">
            <input class="qi" id="m-nombre" placeholder="Medicamento" style="flex:1;min-width:90px">
            <input class="qi" id="m-dosis" placeholder="Dosis" style="width:70px">
            <input class="qi" id="m-via" placeholder="Vía (IV/VO)" style="width:80px">
            <button class="qbtn" onclick="agregarMed('${id}')">+ Agregar</button>
          </div>
        </div>
      </div>

      <!-- ESTUDIOS -->
      <div class="sec">
        <div class="sec-hdr">
          <div class="sec-tit">🔬 ESTUDIOS</div>
          <span class="sec-cnt">${ests.length} solicitados</span>
        </div>
        <div class="sec-body">
          ${ests.length===0 ? '<div class="empty-sec">Sin estudios</div>' :
            ests.map((e,i) => `
            <div class="reg-item">
              <div>
                <div class="ri-txt">${e.nombre}</div>
                <div class="ri-badge ${e.estado==='Listo'?'badge-listo':'badge-pend'}">${e.estado||'Pendiente'}</div>
                <div class="ri-hora">Solicitado: ${e.hora||''}</div>
                ${e.estadoHora ? `<div class="ri-hora">Listo: ${e.estadoHora}</div>` : ''}
              </div>
              <div class="ri-actions">
                <button class="ri-del" onclick="eliminarItem('${id}','estudios',${i})">✕</button>
                ${e.estado!=='Listo' ? `<button class="btn-listo" onclick="marcarListo('${id}',${i})">✓ Listo</button>` : ''}
              </div>
            </div>`).join('')}
          <div class="qform">
            <input class="qi" id="e-nombre" placeholder="BH, RX Tórax, EGO..." style="flex:1">
            <button class="qbtn" onclick="agregarEstudio('${id}')">+</button>
          </div>
        </div>
      </div>

      <!-- NOTAS -->
      <div class="sec full">
        <div class="sec-hdr">
          <div class="sec-tit">📝 NOTAS DE EVOLUCIÓN</div>
          <span class="sec-cnt">${notas.length} notas</span>
        </div>
        <div class="sec-body" style="max-height:320px">
          ${notas.length===0 ? '<div class="empty-sec">Sin notas</div>' :
            notas.map((n,i) => `
            <div class="nota-item">
              <div class="nota-txt">${n.texto}</div>
              <div class="nota-meta">
                <span style="color:var(--cyan);font-weight:600">${n.autor||'Personal médico'}</span>
                <span>${n.fechaHora||n.hora||''}</span>
                <button class="ri-del" onclick="eliminarItem('${id}','notas',${i})">✕</button>
              </div>
            </div>`).join('')}
          <div class="qform" style="flex-direction:column;align-items:stretch;">
            <textarea class="qi" id="n-texto" placeholder="Escribe la nota de evolución..." style="width:100%;height:70px;resize:vertical;"></textarea>
            <div style="display:flex;gap:6px;">
              <input class="qi" id="n-autor" placeholder="Médico / Enfermera" style="flex:1">
              <button class="qbtn" onclick="agregarNota('${id}')">+ Nota</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ── ACCIONES ── */
window.agregarVital = id => {
  const v = {
    presion: document.getElementById('v-presion').value.trim(),
    temp:    document.getElementById('v-temp').value.trim(),
    sato2:   document.getElementById('v-sato2').value.trim(),
    fc:      document.getElementById('v-fc').value.trim(),
    fr:      document.getElementById('v-fr').value.trim(),
    glucosa: document.getElementById('v-glucosa').value.trim(),
    hora: hora(),
    fechaHora: fechaHora()
  };
  if (!v.presion && !v.temp && !v.sato2 && !v.fc && !v.fr && !v.glucosa) return;
  const arr = [...(pacientes[id].vitales||[]), v];
  update(ref(db, `observacion/${id}`), {vitales: arr});
};

window.agregarMed = id => {
  const nombre = document.getElementById('m-nombre').value.trim();
  if (!nombre) return;
  const arr = [...(pacientes[id].medicamentos||[]), {
    nombre,
    dosis: document.getElementById('m-dosis').value.trim(),
    via: document.getElementById('m-via').value.trim(),
    hora: hora(),
    fechaHora: fechaHora()
  }];
  update(ref(db, `observacion/${id}`), {medicamentos: arr});
};

window.agregarEstudio = id => {
  const nombre = document.getElementById('e-nombre').value.trim();
  if (!nombre) return;
  const arr = [...(pacientes[id].estudios||[]), {
    nombre,
    estado: 'Pendiente',
    hora: hora(),
    fechaHora: fechaHora()
  }];
  update(ref(db, `observacion/${id}`), {estudios: arr});
};

window.agregarNota = id => {
  const texto = document.getElementById('n-texto').value.trim();
  if (!texto) return;
  const arr = [...(pacientes[id].notas||[]), {
    texto,
    autor: document.getElementById('n-autor').value.trim() || 'Personal médico',
    hora: hora(),
    fechaHora: fechaHora()
  }];
  update(ref(db, `observacion/${id}`), {notas: arr});
};

window.eliminarItem = (id, campo, idx) => {
  const arr = [...(pacientes[id][campo]||[])];
  arr.splice(idx, 1);
  update(ref(db, `observacion/${id}`), {[campo]: arr});
};

window.marcarListo = (id, idx) => {
  const arr = [...(pacientes[id].estudios||[])];
  arr[idx] = {...arr[idx], estado: 'Listo', estadoHora: hora()};
  update(ref(db, `observacion/${id}`), {estudios: arr});
};

/* ── ALTA ── */
window.darAlta = id => {
  const pac = pacientes[id];
  if (!pac) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Confirmar Alta</h3>
      <p>Se moverá al paciente al historial</p>
      <div class="modal-info">
        <strong>${pac.nombre}</strong><br>
        Folio: #${pac.num||'?'} · P${pac.prioridad||'?'}
        ${pac.numeroCama ? `<br>Cama: ${pac.numeroCama}` : ''}
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" id="btn-cancel">Cancelar</button>
        <button class="btn-confirm" id="btn-ok">✓ Dar de alta</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#btn-cancel').onclick = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

  overlay.querySelector('#btn-ok').onclick = () => {
    const tiempoObs = pac.ingresoObs ? Math.round((Date.now()-pac.ingresoObs)/60000) : null;
    push(ref(db, 'historial'), {
      ...pac,
      id: id,
      horaAlta: hora(),
      fechaAlta: new Date().toLocaleDateString('es-MX'),
      timestampAlta: Date.now(),
      tiempoObservacion: tiempoObs,
      estadoFinal: 'Alta médica'
    }).then(() => {
      remove(ref(db, `observacion/${id}`));
      selId = null;
      overlay.remove();
    }).catch(e => {
      console.error(e);
      alert('Error al dar de alta');
    });
  };
};
</script>
</body>
</html>
