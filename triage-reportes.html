<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIAGE — Reportes</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --R:#E63946;--O:#F4A261;--Y:#E9C46A;--G:#2A9D8F;--B:#457B9D;--T:#0694A2;--ssa-vino:#0694A2;
  --bg:#0A0E1A;--panel:#111827;--panel2:#0D1520;--brd:#1E2D3D;
  --txt:#E8F4FD;--mute:#6B7C93;--mute2:#4A5568;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;}

header{background:var(--panel);border-bottom:1px solid var(--brd);padding:11px 24px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:10px;}
.cruz{width:32px;height:32px;background:var(--B);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.lt{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:3px;}
.ls{font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:2px;}
#clk{font-family:var(--mono);font-size:16px;color:var(--B);letter-spacing:2px;}
.hbtn{background:transparent;border:1px solid var(--mute);color:var(--mute);font-family:var(--mono);font-size:10px;letter-spacing:2px;padding:6px 12px;border-radius:4px;cursor:pointer;transition:all .2s;}
.hbtn:hover{border-color:var(--txt);color:var(--txt);}

/* TOOLBAR */
.tb{background:var(--panel);border-bottom:1px solid var(--brd);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.tb-label{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:2px;}
.tb-input{background:var(--panel2);border:1px solid var(--brd);border-radius:6px;color:var(--txt);font-family:var(--sans);font-size:12px;padding:7px 12px;outline:none;transition:border-color .2s;}
.tb-input:focus{border-color:var(--B);}
.tb-input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5;}
.fbtn{background:var(--B);border:none;color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;padding:8px 16px;border-radius:6px;cursor:pointer;transition:opacity .2s;}
.fbtn:hover{opacity:.8;}
.fbtn-sec{background:transparent;border:1px solid var(--brd);color:var(--mute);font-family:var(--mono);font-size:11px;padding:7px 14px;border-radius:6px;cursor:pointer;transition:all .2s;}
.fbtn-sec:hover{border-color:var(--B);color:var(--B);}
.stats-bar{margin-left:auto;display:flex;gap:14px;align-items:center;}
.stat{font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:6px;}
.sdot{width:7px;height:7px;border-radius:50%;}

/* MAIN */
.main{flex:1;padding:20px 24px;overflow-y:auto;}

/* TABLA */
.tabla-wrap{background:var(--panel);border:1px solid var(--brd);border-radius:12px;overflow:hidden;}
.tabla-hdr{padding:14px 18px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;}
.tabla-tit{font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--mute);}
.acciones{display:flex;gap:8px;}

/* BOTONES IMPRIMIR */
.btn-imp{border:none;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;padding:7px 14px;border-radius:6px;cursor:pointer;transition:opacity .2s;}
.btn-imp:hover{opacity:.8;}
.btn-imp-resumen{background:var(--B);color:#fff;}
.btn-imp-dia{background:var(--G);color:#fff;}
.btn-imp-completo{background:#6B46C1;color:#fff;}

table{width:100%;border-collapse:collapse;}
thead th{padding:10px 14px;text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--mute);border-bottom:1px solid var(--brd);background:var(--panel2);}
tbody tr{border-bottom:1px solid var(--brd);transition:background .15s;cursor:pointer;}
tbody tr:hover{background:#0f1c2e;}
tbody tr:last-child{border-bottom:none;}
td{padding:11px 14px;font-size:12px;}

.prio-pip{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.td-nombre{font-weight:600;}
.td-meta{font-family:var(--mono);font-size:10px;color:var(--mute);}
.td-motivo{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7;}
.dest-tag{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;}
.d1{background:rgba(230,57,70,.12);color:var(--R);}
.d2{background:rgba(244,162,97,.12);color:var(--O);}
.d3{background:rgba(233,196,106,.12);color:var(--Y);}
.d4{background:rgba(42,157,143,.12);color:var(--G);}
.d5{background:rgba(6,148,162,.12);color:var(--T);}

.row-btns{display:flex;gap:5px;}
.rbtn{border:none;font-family:var(--mono);font-size:9px;font-weight:700;padding:4px 9px;border-radius:4px;cursor:pointer;transition:opacity .2s;white-space:nowrap;}
.rbtn:hover{opacity:.8;}
.rbtn-res{background:var(--B);color:#fff;}
.rbtn-comp{background:#6B46C1;color:#fff;}
.rbtn-nota{background:var(--G);color:#fff;}

.empty-tabla{padding:50px;text-align:center;color:var(--mute);font-family:var(--mono);font-size:12px;opacity:.5;}

/* FOOTER */
footer{background:var(--panel);border-top:1px solid var(--brd);padding:9px 24px;display:flex;gap:16px;align-items:center;}
.fi{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;}
.fdot{width:7px;height:7px;border-radius:50%;}
.live{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--B);display:flex;align-items:center;gap:6px;}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--B);animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
<script src="triage-auth.js"></script>
<link rel="stylesheet" href="triage-ssa.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="cruz" style="background:var(--ssa-vino)!important;font-size:16px">📊</div>
    <div><div class="lt">REPORTES</div><div class="ls">REGISTRO DE PACIENTES ATENDIDOS</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div id="clk">--:--:--</div>
    <button class="hbtn" onclick="window.open('triage-medico.html')">← PANEL MÉDICO</button>
  </div>
</header>

<!-- TOOLBAR FILTROS -->
<div class="tb">
  <div class="tb-label">FILTRAR</div>
  <input type="date" class="tb-input" id="f-desde" title="Desde">
  <input type="date" class="tb-input" id="f-hasta" title="Hasta">
  <select class="tb-input" id="f-prio">
    <option value="">Todas las prioridades</option>
    <option value="1">P1 — Rojo</option>
    <option value="2">P2 — Naranja</option>
    <option value="3">P3 — Amarillo</option>
    <option value="4">P4 — Verde</option>
    <option value="5">P5 — Azul</option>
  </select>
  <input type="text" class="tb-input" id="f-nombre" placeholder="Buscar nombre..." style="min-width:160px">
  <button class="fbtn" onclick="aplicarFiltros()">Filtrar</button>
  <button class="fbtn-sec" onclick="limpiarFiltros()">Limpiar</button>

  <div class="stats-bar">
    <div class="stat"><div class="sdot" style="background:var(--R)"></div><span id="s1">0</span></div>
    <div class="stat"><div class="sdot" style="background:var(--O)"></div><span id="s2">0</span></div>
    <div class="stat"><div class="sdot" style="background:var(--Y)"></div><span id="s3">0</span></div>
    <div class="stat"><div class="sdot" style="background:var(--G)"></div><span id="s4">0</span></div>
    <div class="stat"><div class="sdot" style="background:var(--T)"></div><span id="s5">0</span></div>
  </div>
</div>

<div class="main">
  <div class="tabla-wrap">
    <div class="tabla-hdr">
      <div class="tabla-tit">PACIENTES REGISTRADOS — <span id="total-label">0 resultados</span></div>
      <div class="acciones">
        <button class="btn-imp btn-imp-dia" onclick="imprimirReporteDia()">🖨️ REPORTE DEL DÍA</button>
        <button class="btn-imp btn-imp-completo" onclick="imprimirTodos()">📋 TODOS LOS PACIENTES</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>PACIENTE</th>
          <th>MOTIVO</th>
          <th>PRIORIDAD</th>
          <th>DESTINO</th>
          <th>HORA</th>
          <th>ACCIONES</th>
        </tr>
      </thead>
      <tbody id="tabla-body">
        <tr><td colspan="7" class="empty-tabla">Cargando pacientes...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<footer>
  <div class="fi"><div class="fdot" style="background:var(--txt)"></div><span id="f-total">0</span> total hoy</div>
  <div class="fi"><div class="fdot" style="background:var(--R)"></div><span id="f-p1">0</span> críticos</div>
  <div class="fi"><div class="fdot" style="background:var(--G)"></div><span id="f-p4">0</span> menores</div>
  <div class="live"><div class="ldot"></div>SINCRONIZADO</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDTgiL6OvNFYh-PC4g57GTw04pclU-nfs",
  authDomain: "triage-centro-de-salud.firebaseapp.com",
  databaseURL: "https://triage-centro-de-salud-default-rtdb.firebaseio.com",
  projectId: "triage-centro-de-salud",
  storageBucket: "triage-centro-de-salud.firebasestorage.app",
  messagingSenderId: "66063012451",
  appId: "1:66063012451:web:8be493b361302fbd185e56"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let todosPacs = [], pacsFiltrados = [];
const ICOS  = {1:'🚨',2:'⚠️',3:'🔶',4:'✅',5:'🔵'};
const COLS  = {1:'var(--R)',2:'var(--O)',3:'var(--Y)',4:'var(--G)',5:'var(--T)'};
const NOMS  = {1:'P1 ROJO','2':'P2 NARANJA',3:'P3 AMARILLO',4:'P4 VERDE',5:'P5 AZUL'};
const PNOMS = {1:'P1 — ROJO — CRÍTICO',2:'P2 — NARANJA — EMERGENCIA',3:'P3 — AMARILLO — URGENTE',4:'P4 — VERDE — MENOR',5:'P5 — AZUL — CONSULTA'};
const PCOLS = {1:'#E63946',2:'#F4A261',3:'#E9C46A',4:'#2A9D8F',5:'#0694A2'};

setInterval(()=>{
  document.getElementById('clk').textContent=new Date().toLocaleTimeString('es-MX',{hour12:false});
},1000);

// Poner fecha de hoy por defecto
const hoy = new Date().toISOString().split('T')[0];
document.getElementById('f-desde').value = hoy;
document.getElementById('f-hasta').value = hoy;

let dePacientes = [], deHistorial = [], deObservacion = {};

onValue(ref(db,'pacientes'), snap=>{
  const v = snap.val();
  dePacientes = v ? Object.values(v) : [];
  combinar();
});

onValue(ref(db,'historial'), snap=>{
  const v = snap.val();
  deHistorial = v ? Object.values(v) : [];
  combinar();
});

// Escuchar observación para enriquecer reportes
onValue(ref(db,'observacion'), snap=>{
  deObservacion = snap.val() || {};
  combinar();
});

function combinar(){
  const mapa = {};
  [...deHistorial, ...dePacientes].forEach(p=>{ mapa[p.id]=p; });
  // Enriquecer con datos de observación si existen
  Object.values(deObservacion).forEach(obs=>{
    if(mapa[obs.id]){
      mapa[obs.id] = {
        ...mapa[obs.id],
        vitalesObs:   obs.vitales||[],
        medicamentosObs: obs.medicamentos||[],
        estudiosObs:  obs.estudios||[],
        notasObs:     obs.notas||[],
        horaIngresoObs: obs.horaIngreso||null,
        enObservacion: true
      };
    }
  });
  todosPacs = Object.values(mapa).sort((a,b)=>b.timestamp-a.timestamp);
  aplicarFiltros();
  actualizarFooter();
}

function actualizarFooter(){
  document.getElementById('f-total').textContent = todosPacs.length;
  document.getElementById('f-p1').textContent = todosPacs.filter(p=>p.prioridad===1).length;
  document.getElementById('f-p4').textContent = todosPacs.filter(p=>p.prioridad===4||p.prioridad===5).length;
  [1,2,3,4,5].forEach(n=>{
    document.getElementById('s'+n).textContent = todosPacs.filter(p=>p.prioridad===n).length;
  });
}

window.aplicarFiltros = ()=>{
  const desde  = document.getElementById('f-desde').value;
  const hasta  = document.getElementById('f-hasta').value;
  const prio   = document.getElementById('f-prio').value;
  const nombre = document.getElementById('f-nombre').value.toLowerCase().trim();

  pacsFiltrados = todosPacs.filter(p=>{
    const fecha = p.timestamp ? new Date(p.timestamp).toISOString().split('T')[0] : hoy;
    if(desde && fecha < desde) return false;
    if(hasta && fecha > hasta) return false;
    if(prio && p.prioridad !== parseInt(prio)) return false;
    if(nombre && !p.nombre.toLowerCase().includes(nombre)) return false;
    return true;
  });

  renderTabla();
};

window.limpiarFiltros = ()=>{
  document.getElementById('f-desde').value = hoy;
  document.getElementById('f-hasta').value = hoy;
  document.getElementById('f-prio').value = '';
  document.getElementById('f-nombre').value = '';
  aplicarFiltros();
};

function renderTabla(){
  const body = document.getElementById('tabla-body');
  document.getElementById('total-label').textContent = pacsFiltrados.length + ' resultados';

  if(pacsFiltrados.length===0){
    body.innerHTML='<tr><td colspan="7" class="empty-tabla">Sin pacientes en este filtro</td></tr>';
    return;
  }

  body.innerHTML = pacsFiltrados.map(p=>{
    const esSeg = p.motivo&&p.motivo.startsWith('[SEGUIMIENTO]');
    const mot   = esSeg ? p.motivo.replace('[SEGUIMIENTO] ','') : p.motivo;
    return `<tr>
      <td style="font-family:var(--mono);font-size:11px;color:var(--mute)">#${p.num}</td>
      <td>
        <div class="td-nombre">${p.nombre}</div>
        <div class="td-meta">${p.edad||'?'}a · ${p.sexo||'—'}${esSeg?' · [SEG]':''}</div>
      </td>
      <td class="td-motivo">${mot||'—'}</td>
      <td>
        <span style="font-size:15px">${ICOS[p.prioridad]}</span>
        <span style="font-family:var(--mono);font-size:10px;font-weight:700;color:${COLS[p.prioridad]};margin-left:5px">P${p.prioridad}</span>
      </td>
      <td><span class="dest-tag d${p.prioridad}">${p.destino||'—'}</span></td>
      <td style="font-family:var(--mono);font-size:10px;color:var(--mute)">${p.hora||'—'}</td>
      <td>
        <div class="row-btns">
          <button class="rbtn rbtn-res" onclick="imprimirResumen(${p.id})">🖨️ Resumen</button>
          <button class="rbtn rbtn-comp" onclick="imprimirCompleto(${p.id})">📋 Completo</button>
          <button class="rbtn rbtn-nota" onclick="imprimirNotaClinica(${p.id})">📄 Nota Clínica</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

/* ═══════════════════════════════
   FORMATO 1: RESUMEN DEL PACIENTE
   ═══════════════════════════════ */
window.imprimirResumen = (id)=>{
  const p = todosPacs.find(x=>x.id===id);
  if(!p) return;
  const ahora = new Date().toLocaleString('es-MX');
  const esSeg = p.motivo&&p.motivo.startsWith('[SEGUIMIENTO]');
  const mot   = esSeg ? p.motivo.replace('[SEGUIMIENTO] ','') : p.motivo;

  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
  <title>Resumen — ${p.nombre}</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,sans-serif;font-size:13px;color:#111;padding:30px;max-width:600px;margin:0 auto;}
    .hdr{text-align:center;border-bottom:3px solid #111;padding-bottom:16px;margin-bottom:20px;}
    h1{font-size:22px;margin-bottom:4px;}
    .sub{font-size:12px;color:#555;}
    .prio{display:inline-block;background:${PCOLS[p.prioridad]};color:${p.prioridad===3?'#000':'#fff'};font-weight:700;font-size:16px;padding:8px 24px;border-radius:8px;margin:12px 0;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#f5f5f5;padding:16px;border-radius:8px;margin-bottom:18px;}
    .item label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px;}
    .item span{font-size:14px;font-weight:600;}
    .motivo-box{background:#EFF6FF;border-left:4px solid #1A56DB;padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:18px;}
    .motivo-box label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px;}
    .motivo-box p{font-size:14px;color:#111;}
    .just-box{background:#F0FDF4;border-left:4px solid #057A55;padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:18px;}
    .just-box label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px;}
    .just-box p{font-size:12px;color:#333;line-height:1.6;font-style:italic;}
    .firma{border-top:1px solid #ddd;margin-top:30px;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:40px;}
    .firma-box{text-align:center;}
    .firma-line{border-top:1px solid #999;margin-top:40px;padding-top:5px;font-size:10px;color:#666;}
    .print-info{font-size:10px;color:#999;text-align:right;margin-top:16px;}
    @media print{body{padding:15px;}}
  </style><script src="triage-auth.js"><\/script>
<link rel="stylesheet" href="triage-ssa.css">
</head><body>
  <div class="hdr">
    <h1>✚ RESUMEN DE ATENCIÓN</h1>
    <p class="sub">Centro de Salud — Triage Automatizado</p>
    <div class="prio">${PNOMS[p.prioridad]}</div>
  </div>
  <div class="grid">
    <div class="item"><label>Folio</label><span>#${p.num}</span></div>
    <div class="item"><label>Hora de registro</label><span>${p.hora||'—'}</span></div>
    <div class="item"><label>Nombre</label><span>${p.nombre}</span></div>
    <div class="item"><label>Edad / Sexo</label><span>${p.edad||'?'} años · ${p.sexo||'—'}</span></div>
    <div class="item"><label>Área asignada</label><span>${p.destino||'—'}</span></div>
    <div class="item"><label>Tiempo máximo espera</label><span>${p.tiempo_maximo||'—'}</span></div>
    <div class="item"><label>Dolor inicial</label><span>${p.dolor||0}/10</span></div>
    <div class="item"><label>Acompañante</label><span>${p.acomp==='si'?'Sí':'No'}</span></div>
  </div>
  <div class="motivo-box">
    <label>Motivo de consulta</label>
    <p>${mot||'—'}${esSeg?' (Visita de seguimiento)':''}</p>
  </div>
  ${p.justificacion?`<div class="just-box"><label>Justificación clínica (IA)</label><p>${p.justificacion}</p></div>`:''}
  <div class="firma">
    <div class="firma-box"><div class="firma-line">Firma del Médico</div></div>
    <div class="firma-box"><div class="firma-line">Sello / Fecha</div></div>
  </div>
  <div class="print-info">Impreso: ${ahora}</div>
  <script>setTimeout(()=>window.print(),500)<\/script>
  </body></html>`);
  w.document.close();
};

/* ═════════════════════════════════════════
   FORMATO 2: REPORTE DEL DÍA (tabla)
   ═════════════════════════════════════════ */
window.imprimirReporteDia = ()=>{
  const desde = document.getElementById('f-desde').value || hoy;
  const hasta = document.getElementById('f-hasta').value || hoy;
  const lista = pacsFiltrados.length > 0 ? pacsFiltrados : todosPacs.filter(p=>{
    const f = p.timestamp ? new Date(p.timestamp).toISOString().split('T')[0] : hoy;
    return f >= desde && f <= hasta;
  });

  const ahora = new Date().toLocaleString('es-MX');
  const totalPorPrio = [1,2,3,4,5].map(n=>({n, c:lista.filter(p=>p.prioridad===n).length}));

  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
  <title>Reporte del día</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial,sans-serif;font-size:11px;color:#111;padding:20px;}
    .hdr{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:10px;margin-bottom:14px;}
    h1{font-size:18px;}
    .sub{font-size:11px;color:#555;margin-top:2px;}
    .resumen{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px;}
    .res-card{background:#f5f5f5;border-radius:6px;padding:8px 10px;text-align:center;}

      <div class="item" style="margin-bottom:10px">
        <label>Enfermedades crónicas y medicamentos (kiosko)</label>
        ${cronicasArr.length?cronicasArr.map(e=>`<span class="chip">${e}${medsCron[e]?' — '+medsCron[e]:''}</span>`).join(''):'<span>Ninguna referida</span>'}
      </div>
      ${p.medicamentos?`<div class="item" style="margin-bottom:10px">
        <label>Medicamentos confirmados en consulta</label>
        <span>${p.medicamentos}</span>
      </div>`:''}
      <div class="grid2" style="margin-bottom:10px">
        <div class="item"><label>Hospitalizaciones previas</label><span>${p.hospitalizaciones?.tiene?('Sí'+(p.hospitalizaciones.detalle?' — '+p.hospitalizaciones.detalle:'')):'No'}</span></div>
        <div class="item"><label>Cirugías previas</label><span>${p.cirugiasPrevias?.tiene?('Sí'+(p.cirugiasPrevias.detalle?' — '+p.cirugiasPrevias.detalle:'')):'No'}</span></div>
      </div>
      <div class="grid2">
        <div class="item"><label>Alergias</label><span>${alergiasTxt}</span></div>
        <div class="item"><label>Hemotipo</label><span>${p.hemotipo&&p.hemotipo!=='No lo sabe'?p.hemotipo:'No lo sabe'}</span></div>
      </div>
      ${anticoag?.usa?`<div class="alerta-box">⚠ USA ANTICOAGULANTE / ANTIAGREGANTE PLAQUETARIO${anticoag.medicamento?': '+anticoag.medicamento:''} — Riesgo de sangrado</div>`:''}
    </div>
  </div>

  <!-- 3. ANTECEDENTES NO PATOLÓGICOS (HÁBITOS) -->
  <div class="seccion">
    <div class="sec-tit"><span class="sec-num">3</span>Antecedentes no patológicos (hábitos)</div>
    <div class="sec-body">
      <div class="grid3">
        <div class="item"><label>Alcoholismo</label><span>${p.habitos?.alcoholismo?'Sí':'No'}</span></div>
        <div class="item"><label>Tabaquismo</label><span>${p.habitos?.tabaquismo?('Sí'+(p.habitos.tabaquismoDetalle?' — '+p.habitos.tabaquismoDetalle:'')):'No'}</span></div>
        <div class="item"><label>Toxicomanías</label><span>${p.habitos?.toxicomanias?('Sí'+(p.habitos.toxicomaniasDetalle?' — '+p.habitos.toxicomaniasDetalle:'')):'No'}</span></div>
      </div>
    </div>
  </div>

  <!-- 4. PADECIMIENTO ACTUAL -->
  <div class="seccion">
    <div class="sec-tit"><span class="sec-num">4</span>Padecimiento actual</div>
    <div class="sec-body">
      <div class="item" style="margin-bottom:8px"><label>Motivo de consulta</label><span>${mot||'—'}</span></div>
      ${arr(p.sintomas).length?`<div class="item" style="margin-bottom:8px"><label>Síntomas / situación reportada</label>${arr(p.sintomas).map(s=>`<span class="chip">${s}</span>`).join('')}</div>`:''}
      ${p.justificacion?`<div class="item"><label>Valoración inicial (triage)</label><p>${p.justificacion}</p></div>`:''}
    </div>
  </div>

  <!-- 5. EXPLORACIÓN CLÍNICA / HALLAZGOS -->
  <div class="seccion">
    <div class="sec-tit"><span class="sec-num">5</span>Exploración clínica / Hallazgos</div>
    <div class="sec-body">
      ${p.diagnostico?`<div class="item" style="margin-bottom:8px"><label>Diagnóstico${p.cie10?' (CIE-10: '+p.cie10+')':''}</label><span>${p.diagnostico}</span></div>`:''}
      <div class="item"><label>Hallazgos</label><p>${p.hallazgosClinicos||'—'}</p></div>
    </div>
  </div>

  <!-- 6. PLAN DE TRATAMIENTO -->
  <div class="seccion">
    <div class="sec-tit"><span class="sec-num">6</span>Plan de tratamiento</div>
    <div class="sec-body">
      ${p.procedimiento?`<div class="item" style="margin-bottom:8px"><label>Procedimiento solicitado</label><span>${p.procedimiento}</span></div>`:''}
      <div class="item"><label>Tratamiento / indicaciones</label><p>${p.tratamiento||'—'}</p></div>
    </div>
  </div>

  <!-- 7. SIGNOS VITALES -->
  <div class="seccion">
    <div class="sec-tit"><span class="sec-num">7</span>Signos vitales</div>
    <div class="sec-body">
      ${vitalesRows.length?`
      <table>
        <thead><tr>
          <th>Momento</th><th>Presión</th><th>FC</th><th>SpO₂</th><th>Temp</th><th>FR</th><th>Glucosa</th>
        </tr></thead>
        <tbody>
          ${vitalesRows.map(v=>`<tr>
            <td>${v.etiqueta} — ${v.hora||''}</td>
            <td>${v.presion||'—'}</td>
            <td>${v.fc||'—'}</td>
            <td>${v.sato2?v.sato2+'%':'—'}</td>
            <td>${v.temp?v.temp+'°C':'—'}</td>
            <td>${v.fr||'—'}</td>
            <td>${v.glucosa||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>`:'<span>Sin registros de signos vitales.</span>'}
      ${p.peso&&p.talla?`<div class="item" style="margin-top:10px"><label>Peso / Talla / IMC</label><span>${p.peso} kg · ${p.talla} cm · IMC ${(p.peso/((p.talla/100)**2)).toFixed(1)}</span></div>`:''}
    </div>
  </div>

  <!-- 8. CONDUCTA Y PRONÓSTICO -->
  <div class="seccion">
    <div class="sec-tit"><span class="sec-num">8</span>Conducta y pronóstico</div>
    <div class="sec-body">
      ${p.notasConsulta?`<div class="item" style="margin-bottom:10px"><label>Notas de evolución</label><p>${p.notasConsulta}</p></div>`:''}
      <div class="item"><label>Conducta y pronóstico</label><p>${p.conductaPronostico||'—'}</p></div>
      ${p.estadoFinal?`<div class="item" style="margin-top:8px"><label>Estado final</label><span>${p.estadoFinal}</span></div>`:''}
    </div>
  </div>

  <div class="firma">
    <div class="firma-box"><div class="firma-line">Firma del Profesional a Cargo</div></div>
    <div class="firma-box"><div class="firma-line">Sello de la Clínica</div></div>
  </div>
  <div class="print-info">Sistema de Triage Automatizado · Clínica UVM · Folio #${p.num} · ${ahora}</div>
  <script>setTimeout(()=>window.print(),500)<\/script>
  </body></html>`);
  w.document.close();
};

</script>
</body>
</html>
