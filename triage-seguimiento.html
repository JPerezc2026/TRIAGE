<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRIAGE — Seguimiento</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Superficies */
  --bg:#0A0E1A;--panel:#111827;--panel2:#0D1520;--brd:#1E2D3D;--brd2:#243447;
  /* Texto */
  --txt:#E8F4FD;--txt2:#B8C9D9;--mute:#6B7C93;--mute2:#4A5568;
  /* Manchester invariable */
  --R:#DC2626;--O:#EA580C;--Y:#CA8A04;--G:#16A34A;--T:#0694A2;--B:#1D4ED8;--P:#7C3AED;
  /* Tipografía */
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans','Outfit',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;}

header{background:var(--panel);border-bottom:1px solid var(--brd);padding:11px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:10px;}
.cruz{width:32px;height:32px;background:var(--G);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.lt{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:3px;}
.ls{font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:2px;}
#clk{font-family:var(--mono);font-size:16px;color:var(--G);letter-spacing:2px;}
.hbtn{background:transparent;border:1px solid var(--mute);color:var(--mute);font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:6px 12px;border-radius:4px;cursor:pointer;transition:all .2s;}
.hbtn:hover{border-color:var(--txt);color:var(--txt);}

/* TOOLBAR */
.toolbar{background:var(--panel);border-bottom:1px solid var(--brd);padding:12px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;}
.fb{background:transparent;border:1px solid var(--brd);color:var(--mute);font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .2s;}
.fb:hover,.fb.on{border-color:var(--G);color:var(--G);}
.fb.vencido.on{border-color:var(--R);color:var(--R);}
.fb.hoy.on{border-color:var(--Y);color:var(--Y);}
.fb.proximo.on{border-color:var(--O);color:var(--O);}
.alerta-vencidos{background:var(--R);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;margin-left:auto;display:none;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.buscar-inp{background:var(--panel2);border:1px solid var(--brd);border-radius:6px;color:var(--txt);font-family:var(--sans);font-size:12px;padding:7px 12px;outline:none;transition:border-color .2s;width:200px;}
.buscar-inp:focus{border-color:var(--G);}
.buscar-inp::placeholder{color:var(--mute2);}

/* MAIN */
.main{display:grid;grid-template-columns:1fr 400px;flex:1;min-height:0;overflow:hidden;}

/* LISTA */
.panel-lista{padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.lista-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.lista-tit{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--mute);}
.lista-badge{background:var(--brd);font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:20px;}

/* TARJETA SEGUIMIENTO */
.seg-card{background:var(--panel);border:1px solid var(--brd);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .2s;border-left:4px solid var(--brd);}
.seg-card:hover{background:#151f30;}
.seg-card.sel{background:#0d1828;border-color:var(--G);}
.seg-card.vencido{border-left-color:var(--R);}
.seg-card.hoy{border-left-color:var(--Y);}
.seg-card.proximo{border-left-color:var(--O);}
.seg-card.futuro{border-left-color:var(--G);}
.sc-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sc-nom{font-size:14px;font-weight:700;}
.sc-estado{font-family:var(--mono);font-size:9px;font-weight:700;padding:3px 9px;border-radius:4px;}
.es-vencido{background:rgba(230,57,70,.15);color:var(--R);}
.es-hoy{background:rgba(233,196,106,.15);color:var(--Y);}
.es-proximo{background:rgba(244,162,97,.15);color:var(--O);}
.es-futuro{background:rgba(42,157,143,.15);color:var(--G);}
.sc-meta{font-family:var(--mono);font-size:10px;color:var(--mute);margin-bottom:6px;}
.sc-dx{font-size:12px;color:var(--txt);margin-bottom:5px;}
.sc-fecha{display:flex;align-items:center;justify-content:space-between;}
.sc-fecha-lbl{font-family:var(--mono);font-size:9px;color:var(--mute);}
.sc-fecha-val{font-family:var(--mono);font-size:11px;font-weight:700;}
.sc-dias{font-family:var(--mono);font-size:10px;}

.empty-state{padding:50px 24px;text-align:center;color:var(--mute);font-family:var(--mono);font-size:12px;opacity:.5;line-height:2;}

/* PANEL DETALLE */
.panel-det{background:var(--panel);border-left:1px solid var(--brd);overflow-y:auto;display:flex;flex-direction:column;}
.det-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);font-family:var(--mono);font-size:12px;text-align:center;gap:10px;opacity:.4;}
.det-content{padding:24px;display:flex;flex-direction:column;gap:14px;}

/* DETALLE */
.det-hdr{background:var(--panel2);border:1px solid var(--brd);border-radius:10px;padding:14px 16px;}
.dh-nom{font-size:18px;font-weight:700;margin-bottom:4px;}
.dh-meta{font-family:var(--mono);font-size:10px;color:var(--mute);}
.dh-dx{font-size:13px;color:var(--txt);margin-top:6px;}

.alerta-box{border-radius:8px;padding:12px 14px;}
.alerta-vencida{background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.3);}
.alerta-hoy{background:rgba(233,196,106,.1);border:1px solid rgba(233,196,106,.3);}
.alerta-proximo{background:rgba(244,162,97,.1);border:1px solid rgba(244,162,97,.3);}
.alerta-ok{background:rgba(42,157,143,.08);border:1px solid rgba(42,157,143,.2);}
.al-tit{font-family:var(--mono);font-size:9px;letter-spacing:2px;font-weight:700;margin-bottom:4px;}
.al-val{font-size:20px;font-weight:900;font-family:var(--mono);}
.al-sub{font-size:12px;margin-top:3px;opacity:.8;}

/* HISTORIAL SEGUIMIENTOS */
.hist-list{display:flex;flex-direction:column;gap:7px;}
.hist-item{background:var(--panel2);border:1px solid var(--brd);border-radius:7px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;}
.hi-fecha{font-family:var(--mono);font-size:9px;color:var(--mute);min-width:70px;flex-shrink:0;}
.hi-info{flex:1;}
.hi-dx{font-size:12px;font-weight:600;margin-bottom:2px;}
.hi-notas{font-size:11px;color:var(--mute);line-height:1.4;}

/* PROGRAMAR */
.prog-box{background:var(--panel2);border:1px solid var(--brd);border-radius:10px;padding:16px;}
.prog-tit{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--mute);margin-bottom:12px;font-weight:700;}
.prog-opciones{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.prog-btn{background:var(--panel);border:1px solid var(--brd);color:var(--mute);font-family:var(--mono);font-size:10px;padding:9px 10px;border-radius:7px;cursor:pointer;transition:all .2s;text-align:center;}
.prog-btn:hover{border-color:var(--G);color:var(--G);}
.prog-btn.sel{background:rgba(42,157,143,.15);border-color:var(--G);color:var(--G);font-weight:700;}
.prog-custom{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.prog-label{font-family:var(--mono);font-size:9px;color:var(--mute);white-space:nowrap;}
.prog-inp{background:var(--panel);border:1px solid var(--brd);border-radius:6px;color:var(--txt);font-family:var(--sans);font-size:13px;padding:8px 10px;outline:none;flex:1;transition:border-color .2s;}
.prog-inp:focus{border-color:var(--G);}
.prog-inp::placeholder{color:var(--mute2);}
.prog-notas{width:100%;background:var(--panel);border:1px solid var(--brd);border-radius:6px;color:var(--txt);font-family:var(--sans);font-size:12px;padding:8px 10px;outline:none;resize:none;height:60px;transition:border-color .2s;margin-bottom:10px;}
.prog-notas:focus{border-color:var(--G);}
.prog-notas::placeholder{color:var(--mute2);}
.btn-prog{background:var(--G);border:none;color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2px;padding:12px;border-radius:8px;cursor:pointer;transition:opacity .2s;width:100%;}
.btn-prog:hover{opacity:.8;}
.btn-completar{background:var(--P);border:none;color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2px;padding:12px;border-radius:8px;cursor:pointer;transition:opacity .2s;width:100%;margin-top:6px;}
.btn-completar:hover{opacity:.8;}

/* FOOTER */
footer{background:var(--panel);border-top:1px solid var(--brd);padding:9px 24px;display:flex;gap:16px;align-items:center;flex-shrink:0;}
.fi{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;}
.fdot{width:7px;height:7px;border-radius:50%;}
.live{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--G);display:flex;align-items:center;gap:6px;}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--G);animation:pulse 1.5s ease-in-out infinite;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--G);color:#000;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:1px;padding:12px 20px;border-radius:8px;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;z-index:100;}
.toast.show{opacity:1;transform:translateY(0);}

/* NUEVO SEGUIMIENTO MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--panel);border:1px solid var(--brd);border-radius:14px;padding:24px;width:500px;max-width:90vw;display:flex;flex-direction:column;gap:14px;}
.modal-tit{font-size:16px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:1px;}
.mfield label{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--mute);display:block;margin-bottom:5px;}
.minp{width:100%;background:var(--panel2);border:1px solid var(--brd);border-radius:6px;color:var(--txt);font-family:var(--sans);font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s;}
.minp:focus{border-color:var(--G);}
.minp::placeholder{color:var(--mute2);}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-btns{display:flex;gap:10px;margin-top:4px;}
.btn-modal-ok{flex:1;background:var(--G);border:none;color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2px;padding:12px;border-radius:8px;cursor:pointer;transition:opacity .2s;}
.btn-modal-ok:hover{opacity:.8;}
.btn-modal-cancel{background:transparent;border:1px solid var(--brd);color:var(--mute);font-family:var(--mono);font-size:11px;padding:12px 20px;border-radius:8px;cursor:pointer;transition:all .2s;}
.btn-modal-cancel:hover{border-color:var(--R);color:var(--R);}

/* ── HEADER ── */
header{background:var(--panel)!important;border-bottom:1px solid var(--brd)!important;color:var(--txt)!important;}
header .lt,.lt{color:var(--txt)!important;}
header .ls,.ls{color:var(--mute)!important;}
header #clk{color:var(--T)!important;}
header .hbtn{border-color:var(--brd)!important;color:var(--txt2)!important;}
header .hbtn:hover{border-color:var(--T)!important;color:var(--T)!important;background:rgba(6,148,162,.1)!important;}
/* Logo badge en header */
header .cruz{background:var(--T)!important;color:#fff!important;}
/* Badge sesión */
#sesion-badge{color:var(--mute)!important;}
/* ── BODY / FONDO ── */
body{background:var(--bg)!important;color:var(--txt)!important;}
/* ── PANELES ── */
.panel,.card,.calc,.col,.sidebar,.pdet,.content,.ficha,.kpi,.mod-card{background:var(--panel)!important;border-color:var(--brd)!important;color:var(--txt)!important;}
.panel2,.panel-lista,.tb,.buscador,.toolbar,.filtros,.tabs{background:var(--panel2)!important;}
/* ── TEXTO GENERAL ── */
.mute,.mute2,[style*="color:#6B7C93"],[style*="color:#4A5568"]{color:var(--mute)!important;}
/* ── BOTÓN PRINCIPAL ── */
.btn-ok,.btn-calc,.buscar-btn,.fbtn,.btn-filtrar,.btn-imp-resumen,.btn-llamar{background:var(--T)!important;color:#fff!important;}
.btn-ok:hover,.btn-calc:hover,.buscar-btn:hover,.fbtn:hover,.btn-llamar:hover{background:#057885!important;}
/* ── INPUTS ── */
.inp,.fi,.tb-input,.fi-inp,.buscar-input,.buscar-inp{background:var(--panel2)!important;border-color:var(--brd)!important;color:var(--txt)!important;}
.inp:focus,.fi:focus,.tb-input:focus,.fi-inp:focus,.buscar-input:focus,.buscar-inp:focus{border-color:var(--T)!important;}
/* ── SIDEBAR ── */
.sidebar{background:var(--panel)!important;border-color:var(--brd)!important;}
.pac-item:hover,.pac-card:hover,.seg-card:hover,.prow:hover{background:rgba(6,148,162,.12)!important;}
.pac-item.activo,.pac-card.sel,.seg-card.sel,.prow.sel{background:rgba(6,148,162,.15)!important;border-left-color:var(--T)!important;}
/* ── TABS ── */
.tab{color:var(--mute)!important;}
.tab.on{color:var(--T)!important;border-bottom-color:var(--T)!important;}
.tab:hover{color:var(--txt)!important;}
/* ── TABLA ── */
.tabla th,thead th{color:var(--mute)!important;border-color:var(--brd)!important;background:var(--panel2)!important;}
tbody tr:hover td{background:rgba(6,148,162,.1)!important;}
/* ── TICKER (display) ── */
.ticker{background:var(--panel2)!important;border-color:var(--brd)!important;}
.ticker-inner{color:var(--txt2)!important;}
/* ── TOPBAR (index) ── */
.topbar{background:var(--panel)!important;border-color:var(--brd)!important;}
.tb-title,.tb-sub{color:var(--txt)!important;}
#clk{color:var(--T)!important;}
/* ── KPI STRIP ── */
.kpi-strip{background:var(--panel)!important;border-color:var(--brd)!important;}
/* ── MODULO CARD ── */
.mod-card{border-color:var(--brd)!important;color:var(--txt)!important;}
.mod-card:hover{box-shadow:0 8px 32px rgba(6,148,162,.15)!important;}
/* ── FOOTER DISPLAY ── */
footer{background:var(--panel)!important;border-color:var(--brd)!important;color:var(--txt)!important;}
footer .fi{color:var(--txt2)!important;}
/* ── HEADER DISPLAY ── */
.hdr{background:var(--panel)!important;border-color:var(--brd)!important;}
.htit,.hsub,.hlogo{color:var(--txt)!important;}


  * { -webkit-tap-highlight-color: transparent; }

  header { padding: 8px 18px; }

  /* Layout — lista izquierda, detalle derecha */
  .main {
    grid-template-columns: 1fr 420px;
    height: calc(100vh - 98px);
  }

  /* Panel lista */
  .panel-lista {
    padding: 14px 16px;
    gap: 8px;
    -webkit-overflow-scrolling: touch;
  }

  /* Tarjetas de seguimiento táctiles */
  .seg-card {
    padding: 13px 15px;
    min-height: 64px;
    border-radius: 10px;
    touch-action: manipulation;
  }
  .sc-nom { font-size: 14px; }
  .sc-meta { font-size: 11px; }
  .sc-fecha { font-size: 12px; }

  /* Panel detalle */
  .panel-det {
    -webkit-overflow-scrolling: touch;
  }
  .det-in { padding: 18px 20px; }

  /* Opciones de programación — 2 cols */
  .prog-opciones {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .prog-opt {
    min-height: 48px;
    font-size: 12px;
    touch-action: manipulation;
  }

  /* Inputs de fecha y notas */
  .seg-inp, .seg-select {
    min-height: 44px;
    font-size: 14px;
    padding: 10px 12px;
    touch-action: manipulation;
  }
  .seg-textarea {
    font-size: 14px;
    min-height: 80px;
    -webkit-overflow-scrolling: touch;
  }

  /* Botones de acción */
  .btn-programar, .btn-seg-ok {
    min-height: 50px;
    font-size: 13px;
    border-radius: 9px;
    touch-action: manipulation;
  }

  /* Fila meds/acciones */
  .mrow {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* Filtros de fecha */
  .filtros-seg {
    padding: 8px 16px;
    gap: 8px;
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  .fb-seg {
    min-height: 38px;
    padding: 7px 14px;
    font-size: 11px;
    white-space: nowrap;
    touch-action: manipulation;
  }
}

/* iPad Pro 12.9" */

  .seg-card { min-height: 70px; }
  .sc-nom { font-size: 15px; }
  .btn-programar, .btn-seg-ok { min-height: 54px; font-size: 14px; }
}

</style>

</head>
<body>

<header>
  <div class="logo-uvm" style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
    <div class="cruz" style="background:var(--T)!important;color:#fff;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">🩺</div>
    <div class="lt" style="font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.3px;">Seguimiento Clínica UVM</div>
  </div>
  <div class="logo">
    <div class="cruz" style="background:var(--T)!important;font-size:16px">📅</div>
    <div><div class="lt">SEGUIMIENTO</div><div class="ls">CONTROL DE CITAS Y ALERTAS</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div id="clk">--:--:--</div>
    <button class="hbtn" onclick="abrirModal()">+ NUEVO</button>
    <button class="hbtn" onclick="window.open('triage-medico.html')">← MÉDICO</button>
    <button class="hbtn" onclick="window.open('triage-consultorio.html')">🩺 CONSULTORIO</button>
  </div>
</header>

<div class="toolbar">
  <button class="fb vencido on" id="f-vencido" onclick="filtrar('vencido')">🔴 VENCIDOS</button>
  <button class="fb hoy" id="f-hoy" onclick="filtrar('hoy')">🟡 HOY</button>
  <button class="fb proximo" id="f-proximo" onclick="filtrar('proximo')">🟠 PRÓXIMOS 7 DÍAS</button>
  <button class="fb" id="f-todos" onclick="filtrar('todos')">TODOS</button>
  <input class="buscar-inp" id="buscar-inp" placeholder="Buscar nombre..." oninput="renderLista()">
  <div class="alerta-vencidos" id="alerta-vencidos">⚠ SEGUIMIENTOS VENCIDOS</div>
</div>

<div class="main">
  <div class="panel-lista">
    <div class="lista-hdr">
      <div class="lista-tit">PACIENTES EN SEGUIMIENTO</div>
      <div class="lista-badge" id="lista-badge">0</div>
    </div>
    <div id="lista-segs"></div>
  </div>

  <div class="panel-det" id="panel-det">
    <div class="det-empty">
      <div style="font-size:36px">📅</div>
      Selecciona un paciente<br>para ver su seguimiento
    </div>
  </div>
</div>

<footer>
  <div class="fi"><div class="fdot" style="background:var(--R)"></div><span id="f-cnt-vencido">0</span> vencidos</div>
  <div class="fi"><div class="fdot" style="background:var(--Y)"></div><span id="f-cnt-hoy">0</span> hoy</div>
  <div class="fi"><div class="fdot" style="background:var(--O)"></div><span id="f-cnt-proximo">0</span> próximos</div>
  <div class="fi"><div class="fdot" style="background:var(--G)"></div><span id="f-cnt-total">0</span> total</div>
  <div class="live"><div class="ldot"></div>FIREBASE</div>
</footer>

<div class="toast" id="toast"></div>

<!-- MODAL NUEVO SEGUIMIENTO -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div>
      <div class="modal-tit">📅 Nuevo Seguimiento</div>
      <div class="modal-sub">PROGRAMAR CITA DE CONTROL</div>
    </div>
    <div class="mrow">
      <div class="mfield">
        <label>NOMBRE DEL PACIENTE</label>
        <input class="minp" id="m-nombre" placeholder="Apellidos, Nombre">
      </div>
      <div class="mfield">
        <label>EDAD / SEXO</label>
        <input class="minp" id="m-edad" placeholder="Ej: 45a / F">
      </div>
    </div>
    <div class="mfield">
      <label>DIAGNÓSTICO / MOTIVO DE SEGUIMIENTO</label>
      <input class="minp" id="m-dx" placeholder="Ej: HTA, DM2, Embarazo 20 SDG, TB...">
    </div>

    <!-- PLANTILLAS RÁPIDAS -->
    <div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:1px;margin-bottom:8px;">PLANTILLAS RÁPIDAS</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;" id="plantillas">
        <button class="fb" onclick="aplicarPlantilla('HTA — Control mensual',30)">HTA · 1 mes</button>
        <button class="fb" onclick="aplicarPlantilla('HTA — Control trimestral',90)">HTA · 3 meses</button>
        <button class="fb" onclick="aplicarPlantilla('DM2 — Control mensual',30)">DM2 · 1 mes</button>
        <button class="fb" onclick="aplicarPlantilla('DM2 — Control trimestral',90)">DM2 · 3 meses</button>
        <button class="fb" onclick="aplicarPlantilla('Control prenatal',28)">Embarazo · 4 sem</button>
        <button class="fb" onclick="aplicarPlantilla('Niño sano — Vigilancia',60)">Niño sano · 2 mes</button>
        <button class="fb" onclick="aplicarPlantilla('Tuberculosis — DOTS',7)">TB · 1 semana</button>
        <button class="fb" onclick="aplicarPlantilla('Desnutrición — Control',15)">Desnutrición · 15d</button>
        <button class="fb" onclick="aplicarPlantilla('Post-urgencia',7)">Post-urgencia · 1 sem</button>
        <button class="fb" onclick="aplicarPlantilla('Seguimiento general',30)">General · 1 mes</button>
      </div>
    </div>

    <div class="mrow">
      <div class="mfield">
        <label>FECHA DE PRÓXIMA CITA</label>
        <input class="minp" id="m-fecha" type="date">
      </div>
      <div class="mfield">
        <label>NOTAS / INDICACIONES</label>
        <input class="minp" id="m-notas" placeholder="Opcional">
      </div>
    </div>

    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-modal-ok" onclick="guardarSeguimiento()">✓ PROGRAMAR</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, update, remove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDTgiL6OvNFYh-PC4g57GTw04pclU-nfs",
  authDomain: "triage-centro-de-salud.firebaseapp.com",
  databaseURL: "https://triage-centro-de-salud-default-rtdb.firebaseio.com",
  projectId: "triage-centro-de-salud",
  storageBucket: "triage-centro-de-salud.firebasestorage.app",
  messagingSenderId: "66063012451",
  appId: "1:66063012451:web:8be493b361302fbd185e56"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const segRef = ref(db,'seguimientos');

let seguimientos={}, keysMap={}, selKey=null, filtroActual='vencido';

setInterval(()=>document.getElementById('clk').textContent=
  new Date().toLocaleTimeString('es-MX',{hour12:false}),1000);

/* FIREBASE */
onValue(segRef, snap=>{
  keysMap={};
  const val=snap.val()||{};
  Object.entries(val).forEach(([k,v])=>keysMap[k]=v);
  seguimientos=val;
  renderLista();
  actualizarFooter();
  if(selKey && seguimientos[selKey]) renderDetalle(selKey);
});

/* ESTADO SEGUIMIENTO */
function estadoSeg(seg){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const cita=new Date(seg.fechaCita+'T00:00:00');
  const diff=Math.floor((cita-hoy)/86400000);
  if(diff<0) return{tipo:'vencido',dias:Math.abs(diff),label:`Vencido hace ${Math.abs(diff)}d`,cls:'es-vencido',cardCls:'vencido'};
  if(diff===0) return{tipo:'hoy',dias:0,label:'HOY',cls:'es-hoy',cardCls:'hoy'};
  if(diff<=7) return{tipo:'proximo',dias:diff,label:`En ${diff}d`,cls:'es-proximo',cardCls:'proximo'};
  return{tipo:'futuro',dias:diff,label:`En ${diff}d`,cls:'es-futuro',cardCls:'futuro'};
}

/* RENDER LISTA */
window.renderLista=()=>{
  const buscar=document.getElementById('buscar-inp').value.toLowerCase();
  let segs=Object.entries(seguimientos)
    .filter(([k,s])=>!s.completado)
    .filter(([k,s])=>!buscar||s.nombre.toLowerCase().includes(buscar))
    .map(([k,s])=>({key:k,...s,estado:estadoSeg(s)}));

  // Filtro
  if(filtroActual!=='todos')
    segs=segs.filter(s=>s.estado.tipo===filtroActual);

  // Ordenar: vencidos primero, luego por fecha
  segs.sort((a,b)=>{
    const ord={vencido:0,hoy:1,proximo:2,futuro:3};
    if(ord[a.estado.tipo]!==ord[b.estado.tipo]) return ord[a.estado.tipo]-ord[b.estado.tipo];
    return new Date(a.fechaCita)-new Date(b.fechaCita);
  });

  document.getElementById('lista-badge').textContent=segs.length;

  if(segs.length===0){
    document.getElementById('lista-segs').innerHTML=
      '<div class="empty-state">Sin seguimientos en este filtro</div>';
    return;
  }

  document.getElementById('lista-segs').innerHTML=segs.map(s=>`
    <div class="seg-card ${s.estado.cardCls} ${selKey===s.key?'sel':''}" onclick="verSeg('${s.key}')">
      <div class="sc-hdr">
        <div class="sc-nom">${s.nombre}</div>
        <div class="sc-estado ${s.estado.cls}">${s.estado.label}</div>
      </div>
      <div class="sc-meta">${s.edadSexo||''} · Programado: ${s.fechaPrograma||'—'}</div>
      <div class="sc-dx">${s.diagnostico}</div>
      <div class="sc-fecha">
        <div>
          <div class="sc-fecha-lbl">Próxima cita</div>
          <div class="sc-fecha-val" style="color:${s.estado.tipo==='vencido'?'var(--R)':s.estado.tipo==='hoy'?'var(--Y)':'var(--G)'}">${formatFecha(s.fechaCita)}</div>
        </div>
        ${s.notas?`<div style="font-size:11px;color:var(--mute);font-style:italic;max-width:150px;text-align:right">${s.notas.slice(0,40)}${s.notas.length>40?'…':''}</div>`:''}
      </div>
    </div>`).join('');
};

function actualizarFooter(){
  const activos=Object.values(seguimientos).filter(s=>!s.completado);
  const cnts={vencido:0,hoy:0,proximo:0,futuro:0};
  activos.forEach(s=>{ const e=estadoSeg(s); cnts[e.tipo]++; });
  document.getElementById('f-cnt-vencido').textContent=cnts.vencido;
  document.getElementById('f-cnt-hoy').textContent=cnts.hoy;
  document.getElementById('f-cnt-proximo').textContent=cnts.proximo;
  document.getElementById('f-cnt-total').textContent=activos.length;
  const alertaEl=document.getElementById('alerta-vencidos');
  alertaEl.style.display=cnts.vencido>0?'block':'none';
  alertaEl.textContent=`⚠ ${cnts.vencido} SEGUIMIENTOS VENCIDOS`;
}

window.filtrar=f=>{
  filtroActual=f;
  ['vencido','hoy','proximo','todos'].forEach(id=>{
    const el=document.getElementById('f-'+id);
    if(el) el.className='fb'+(id==='vencido'?' vencido':id==='hoy'?' hoy':id==='proximo'?' proximo':'')+(f===id?' on':'');
  });
  renderLista();
};

window.verSeg=key=>{
  selKey=key;
  renderLista();
  renderDetalle(key);
};

/* RENDER DETALLE */
function renderDetalle(key){
  const s=seguimientos[key];
  if(!s) return;
  const est=estadoSeg(s);

  // Historial de seguimientos del mismo paciente
  const histPac=Object.entries(seguimientos)
    .filter(([k,x])=>x.nombre?.toLowerCase()===s.nombre?.toLowerCase()&&x.completado)
    .sort((a,b)=>new Date(b[1].fechaCompletado||0)-new Date(a[1].fechaCompletado||0))
    .slice(0,5);

  const alertaCls={vencido:'alerta-vencida',hoy:'alerta-hoy',proximo:'alerta-proximo',futuro:'alerta-ok'}[est.tipo];
  const alertaColor={vencido:'var(--R)',hoy:'var(--Y)',proximo:'var(--O)',futuro:'var(--G)'}[est.tipo];
  const alertaMsgs={
    vencido:`Cita vencida hace ${est.dias} día${est.dias!==1?'s':''}. Paciente no localizado o sin asistir.`,
    hoy:'La cita es HOY. Verificar si el paciente se presentó.',
    proximo:`La cita es en ${est.dias} día${est.dias!==1?'s':''}. Confirmar con el paciente.`,
    futuro:`Cita programada en ${est.dias} días.`
  };

  document.getElementById('panel-det').innerHTML=`
  <div class="det-content">

    <div class="det-hdr">
      <div class="dh-nom">${s.nombre}</div>
      <div class="dh-meta">${s.edadSexo||''} · Programado el: ${s.fechaPrograma||'—'}</div>
      <div class="dh-dx">${s.diagnostico}</div>
      ${s.notas?`<div style="font-size:12px;color:var(--mute);margin-top:5px;font-style:italic">${s.notas}</div>`:''}
    </div>

    <!-- ALERTA ESTADO -->
    <div class="alerta-box ${alertaCls}">
      <div class="al-tit" style="color:${alertaColor}">
        ${est.tipo==='vencido'?'🔴 VENCIDO':est.tipo==='hoy'?'🟡 HOY':est.tipo==='proximo'?'🟠 PRÓXIMO':'✅ PROGRAMADO'}
      </div>
      <div class="al-val" style="color:${alertaColor}">${formatFecha(s.fechaCita)}</div>
      <div class="al-sub">${alertaMsgs[est.tipo]}</div>
    </div>

    <!-- HISTORIAL -->
    <div>
      <div style="font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--mute);margin-bottom:8px;">HISTORIAL DE SEGUIMIENTOS</div>
      ${histPac.length===0
        ?'<div style="font-size:12px;color:var(--mute2);font-style:italic">Sin citas completadas previas</div>'
        :`<div class="hist-list">
          ${histPac.map(([k,h])=>`
          <div class="hist-item">
            <div class="hi-fecha">${h.fechaCompletado||'—'}</div>
            <div class="hi-info">
              <div class="hi-dx">${h.diagnostico}</div>
              <div class="hi-notas">${h.notasCompletado||'Sin notas'}</div>
            </div>
          </div>`).join('')}
        </div>`}
    </div>

    <!-- REPROGRAMAR -->
    <div class="prog-box">
      <div class="prog-tit">REPROGRAMAR PRÓXIMA CITA</div>
      <div class="prog-opciones" id="prog-opciones">
        <button class="prog-btn" onclick="selProgBtn(this,7)">1 semana</button>
        <button class="prog-btn" onclick="selProgBtn(this,14)">2 semanas</button>
        <button class="prog-btn" onclick="selProgBtn(this,30)">1 mes</button>
        <button class="prog-btn" onclick="selProgBtn(this,60)">2 meses</button>
        <button class="prog-btn" onclick="selProgBtn(this,90)">3 meses</button>
        <button class="prog-btn" onclick="selProgBtn(this,180)">6 meses</button>
      </div>
      <div class="prog-custom">
        <div class="prog-label">O elegir fecha:</div>
        <input class="prog-inp" type="date" id="prog-fecha-custom">
      </div>
      <textarea class="prog-notas" id="prog-notas" placeholder="Notas para la próxima cita..."></textarea>
      <button class="btn-prog" onclick="reprogramar('${key}')">📅 REPROGRAMAR CITA</button>
      <button class="btn-completar" onclick="marcarCompletado('${key}')">✓ MARCAR COMO COMPLETADO</button>
    </div>

  </div>`;
}

/* SELECCIONAR DÍAS EN REPROGRAMAR */
let diasSelProg=null;
window.selProgBtn=(btn,dias)=>{
  diasSelProg=dias;
  document.querySelectorAll('.prog-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  // Calcular fecha
  const fecha=new Date(); fecha.setDate(fecha.getDate()+dias);
  document.getElementById('prog-fecha-custom').value=fecha.toISOString().split('T')[0];
};

window.reprogramar=key=>{
  const fechaEl=document.getElementById('prog-fecha-custom');
  const notas=document.getElementById('prog-notas').value.trim();
  if(!fechaEl.value){alert('Selecciona una fecha o un período.');return;}
  update(ref(db,`seguimientos/${key}`),{
    fechaCita:fechaEl.value,
    notas:notas||seguimientos[key].notas||'',
    fechaPrograma:new Date().toLocaleDateString('es-MX'),
    reprogramaciones:(seguimientos[key].reprogramaciones||0)+1
  });
  mostrarToast('📅 Cita reprogramada');
};

window.marcarCompletado=key=>{
  const notas=document.getElementById('prog-notas').value.trim();
  if(!confirm('¿Marcar esta cita como completada?')) return;
  update(ref(db,`seguimientos/${key}`),{
    completado:true,
    fechaCompletado:new Date().toLocaleDateString('es-MX'),
    notasCompletado:notas
  });
  selKey=null;
  document.getElementById('panel-det').innerHTML=
    '<div class="det-empty"><div style="font-size:36px">📅</div>Selecciona un paciente</div>';
  mostrarToast('✓ Cita completada');
};

/* MODAL NUEVO */
window.abrirModal=()=>{
  document.getElementById('modal-overlay').classList.add('show');
  // Fecha por defecto: 1 mes
  const f=new Date(); f.setDate(f.getDate()+30);
  document.getElementById('m-fecha').value=f.toISOString().split('T')[0];
};
window.cerrarModal=()=>document.getElementById('modal-overlay').classList.remove('show');

window.aplicarPlantilla=(dx,dias)=>{
  document.getElementById('m-dx').value=dx;
  const f=new Date(); f.setDate(f.getDate()+dias);
  document.getElementById('m-fecha').value=f.toISOString().split('T')[0];
  document.querySelectorAll('#plantillas .fb').forEach(b=>b.classList.remove('on'));
  event.target.classList.add('on');
};

window.guardarSeguimiento=()=>{
  const nombre=document.getElementById('m-nombre').value.trim();
  const dx=document.getElementById('m-dx').value.trim();
  const fecha=document.getElementById('m-fecha').value;
  if(!nombre){alert('Ingresa el nombre del paciente.');return;}
  if(!dx){alert('Ingresa el diagnóstico.');return;}
  if(!fecha){alert('Selecciona una fecha.');return;}
  push(segRef,{
    nombre,
    edadSexo:document.getElementById('m-edad').value.trim(),
    diagnostico:dx,
    fechaCita:fecha,
    notas:document.getElementById('m-notas').value.trim(),
    fechaPrograma:new Date().toLocaleDateString('es-MX'),
    timestamp:Date.now(),
    completado:false,
    reprogramaciones:0
  });
  cerrarModal();
  ['m-nombre','m-edad','m-dx','m-notas'].forEach(id=>document.getElementById(id).value='');
  mostrarToast('✓ Seguimiento programado');
};

/* HELPERS */
function formatFecha(f){
  if(!f) return '—';
  const d=new Date(f+'T00:00:00');
  return d.toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}

function mostrarToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// Arrancar con filtro de vencidos
window.filtrar('vencido');
</script>
</body>
</html>
